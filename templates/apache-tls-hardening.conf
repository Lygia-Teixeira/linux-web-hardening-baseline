# Endurecimento de TLS no Apache (nivel de servidor)
#
# cPanel/WHM: Service Configuration > Include Editor > Pre VirtualHost Include >
# All Versions (grava em /etc/apache2/conf.d/includes/pre_virtualhost_global.conf,
# carregado depois do bloco SSL global e preservado nos rebuilds do cPanel).
# Apache puro: incluir no contexto de servidor (fora dos VirtualHost).
#
# Versao do protocolo: no WHM, Apache Configuration > Global Configuration >
# SSL/TLS Protocols = "TLSv1.2 TLSv1.3". Em Apache puro, descomentar SSLProtocol.
#
# Antes:   grep -c SSLCipherSuite /etc/apache2/conf/httpd.conf   (esperado: 1, so o global)
# Depois:  apachectl configtest  ->  "Syntax OK"  ->  restart graceful
# Conferir: scripts/check-tls.sh <dominio>
#
# Impacto conhecido: clientes muito antigos (Windows XP/IE, Android <= 4.3) deixam
# de conectar. Navegadores atuais nao sao afetados.
# As cifras do TLS 1.3 nao entram em SSLCipherSuite; o OpenSSL usa as padrao.

<IfModule ssl_module>
    # SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    # 0-RTT desabilitado (padrao): nao habilitar SSLEarlyData
</IfModule>
