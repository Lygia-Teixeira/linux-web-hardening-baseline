# Cabecalhos de seguranca para sites WordPress em Apache (.htaccess)
#
# Onde colar: no TOPO do .htaccess do docroot, ANTES dos blocos "# BEGIN" de
# plugins (WordPress, seguranca, cache). Fora dos marcadores dos plugins, o bloco
# nao e apagado quando eles regravam o arquivo.
#
# Pre-requisito: mod_headers carregado (httpd -M | grep headers).
# Backup antes: cp -p .htaccess ../htaccess.bkp-$(date +%Y%m%d)-headers
# Reverter: apagar tudo entre BEGIN e END.
#
# Decisoes:
# - HSTS de 1 ano SEM includeSubDomains/preload: nao travar subdominios que ainda
#   nao tem certificado. Avaliar includeSubDomains depois de inventariar subdominios.
# - X-Frame-Options SAMEORIGIN: o editor e o customizer do WordPress usam iframe
#   da propria origem.
# - CSP comeca em Report-Only: observa sem bloquear. Ver docs/02-sites-wordpress.md
#   para o processo de passar para modo de bloqueio.

# BEGIN Security Headers
<IfModule mod_headers.c>
	Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
	Header always unset X-Powered-By
</IfModule>
# END Security Headers
