# Bloqueio global de varreduras automatizadas e de robos de IA (Apache 2.4)
#
# Objetivo: responder a caminhos de varredura INEXISTENTES e a crawlers de IA no
# proprio Apache, em milissegundos, sem carregar o PHP/WordPress. Em servidores
# compartilhados, varreduras chegaram a ser a maior parte das respostas 404, cada
# uma custando um carregamento completo do WordPress.
#
# Onde: include global (cPanel: Pre VirtualHost Include). <If> no nivel do servidor
# vale para todos os vhosts e prevalece sobre o .htaccess.
#
# Pontos importantes:
# 1. So bloqueia se o arquivo/pasta NAO existir. Antes de aplicar, confirmar que
#    nenhum docroot usa esses caminhos (ex.: /v2 ou /api reais).
# 2. ErrorDocument em TEXTO PURO. Sem isso, o Apache procura /403.shtml; se nao
#    existir, a requisicao cai no WordPress e o bloqueio passa a custar CPU.
# 3. 403 x 410: se o lfd bane IPs por excesso de 403 (LF_APACHE_403 > 0 com
#    LF_APACHE_403_PERM), usar a VARIANTE 410, que nao gera "client denied" no
#    error_log e nao enche o csf.deny de IPs de robos.
# 4. Buscadores (Googlebot, Bingbot, Applebot) e geradores de previa de links
#    (facebookexternalhit) continuam liberados.
# 5. Testar com User-Agent completo: regras antigas do ModSecurity podem recusar
#    UA reduzido (ex.: so "Mozilla/5.0") e confundir o teste.

# BEGIN bloqueio varredura/bots
<If "%{HTTP_USER_AGENT} =~ /(ClaudeBot|GPTBot|ChatGPT-User|OAI-SearchBot|PerplexityBot|Bytespider|CCBot|Meta-ExternalAgent|YouBot|Qwen|GrokBot|PanguBot)/i">
    ErrorDocument 403 "Forbidden"
    Require all denied
</If>
<ElseIf "%{REQUEST_URI} =~ m#^/(api|v1|actuator|proc|debug|telescope|_ignition|\.env|\.git|\.ssh|graphql)(/|$)# && ! -f '%{DOCUMENT_ROOT}%{REQUEST_URI}' && ! -d '%{DOCUMENT_ROOT}%{REQUEST_URI}'">
    ErrorDocument 403 "Forbidden"
    Require all denied
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#(env\.js|\.ya?ml|\.sql|\.bak|\.key|\.map|\.pem|\.npmrc|\.properties)$#i && ! -f '%{DOCUMENT_ROOT}%{REQUEST_URI}'">
    ErrorDocument 403 "Forbidden"
    Require all denied
</ElseIf>
# END bloqueio varredura/bots

# VARIANTE 410 (quando o lfd bane por 403) - usar NO LUGAR do bloco acima.
# Com "Redirect gone" dentro de <If>, %{REQUEST_FILENAME} ainda nao esta mapeado;
# por isso o teste de existencia monta o caminho com DOCUMENT_ROOT + REQUEST_URI.
#
# <If "%{REQUEST_URI} =~ m#^/(api|v1|actuator|\.env|\.git)(/|$)# && ! -f '%{DOCUMENT_ROOT}%{REQUEST_URI}' && ! -d '%{DOCUMENT_ROOT}%{REQUEST_URI}'">
#     ErrorDocument 410 "Gone"
#     Redirect gone
# </If>
#
# Verificacao (de fora, apos apachectl configtest + graceful):
#   curl -s -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0 (X11; Linux x86_64)' https://<site>/.env      -> 403/410
#   curl -s -o /dev/null -w '%{http_code}\n' -A 'Googlebot/2.1' https://<site>/                              -> 200
#   curl -s -o /dev/null -w '%{http_code}\n' https://<site>/<arquivo-real>.map                               -> 200
